<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="860" height="190">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#1a2f4a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloudTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boltGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="190" fill="url(#bg)" rx="14"/>

  <!-- Subtle grid overlay for tech feel -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="860" y2="40"/>
    <line x1="0" y1="80" x2="860" y2="80"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="160" x2="860" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="190"/>
    <line x1="200" y1="0" x2="200" y2="190"/>
    <line x1="300" y1="0" x2="300" y2="190"/>
  </g>

  <!-- Cloud — back layer (darker, offset) -->
  <g opacity="0.55">
    <ellipse cx="120" cy="118" rx="80" ry="46" fill="#1e3a5f"/>
    <ellipse cx="80"  cy="104" rx="56" ry="42" fill="#1e3a5f"/>
    <ellipse cx="162" cy="106" rx="56" ry="40" fill="#1e3a5f"/>
    <ellipse cx="120" cy="92"  rx="54" ry="44" fill="#1e3a5f"/>
  </g>

  <!-- Cloud — mid layer -->
  <ellipse cx="118" cy="124" rx="76" ry="42" fill="#334155"/>
  <ellipse cx="76"  cy="110" rx="54" ry="38" fill="#334155"/>
  <ellipse cx="158" cy="112" rx="52" ry="36" fill="#334155"/>
  <ellipse cx="118" cy="96"  rx="52" ry="44" fill="#475569"/>

  <!-- Cloud — top highlights -->
  <ellipse cx="88"  cy="100" rx="38" ry="30" fill="url(#cloudTop)"/>
  <ellipse cx="148" cy="97"  rx="36" ry="30" fill="url(#cloudTop)"/>
  <ellipse cx="118" cy="82"  rx="32" ry="28" fill="#64748b"/>

  <!-- Rain drops -->
  <g fill="#7dd3fc" opacity="0.45">
    <rect x="52"  y="158" width="2.5" height="16" rx="1.5"/>
    <rect x="70"  y="164" width="2.5" height="12" rx="1.5"/>
    <rect x="88"  y="157" width="2.5" height="18" rx="1.5"/>
    <rect x="106" y="161" width="2.5" height="15" rx="1.5"/>
    <rect x="124" y="156" width="2.5" height="20" rx="1.5"/>
    <rect x="142" y="162" width="2.5" height="14" rx="1.5"/>
    <rect x="160" y="158" width="2.5" height="17" rx="1.5"/>
    <rect x="178" y="165" width="2.5" height="11" rx="1.5"/>
  </g>

  <!-- Lightning bolt glow halo -->
  <polygon points="122,56 103,108 121,108 100,155 138,97 120,97 138,56"
           fill="#fde68a" opacity="0.18" filter="url(#boltGlow)"/>

  <!-- Lightning bolt -->
  <polygon points="122,56 103,108 121,108 100,155 138,97 120,97 138,56"
           fill="url(#bolt)"/>

  <!-- Title -->
  <text x="218" y="96"
        font-family="'Courier New', Courier, monospace"
        font-size="52" font-weight="900"
        fill="#f1f5f9" letter-spacing="4">CUMULONIMBUS</text>

  <!-- Tagline -->
  <text x="220" y="130"
        font-family="'Courier New', Courier, monospace"
        font-size="16" fill="#64748b" letter-spacing="4">A  VULNERABLE  CLOUD  ENVIRONMENT</text>

  <!-- AWS pill -->
  <rect x="220" y="148" width="64" height="26" rx="13" fill="#FF9900"/>
  <text x="252" y="165"
        font-family="'Courier New', Courier, monospace"
        font-size="12" font-weight="bold" fill="white" text-anchor="middle">AWS</text>

  <!-- Azure pill -->
  <rect x="294" y="148" width="72" height="26" rx="13" fill="#0078D4"/>
  <text x="330" y="165"
        font-family="'Courier New', Courier, monospace"
        font-size="12" font-weight="bold" fill="white" text-anchor="middle">AZURE</text>
</svg>
