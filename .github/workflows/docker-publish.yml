name: Publish Docker image

# Builds the Cumulonimbus image and pushes it to Docker Hub on every push to
# main. The image is verified to contain NO credentials/state before it is
# pushed — if any are found, the workflow fails and nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build, verify and push
    runs-on: ubuntu-latest
    env:
      # Override by setting a repository variable named DOCKERHUB_IMAGE.
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'cumulonimbuscloud/cumulonimbus' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}

      - name: Verify the image contains no credentials or state
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:ci-${{ github.sha }}"
          cid="$(docker create "$image")"
          docker export "$cid" | tar -t > image_files.txt
          docker rm "$cid" >/dev/null

          # Secrets that should never ship, scoped to our app directory so that
          # legitimate library files (e.g. certifi's cacert.pem) don't trip it.
          app_hits="$(grep -E '^root/app/' image_files.txt \
            | grep -E -i '(/\.data/|/credentials$|\.tfstate(\.backup)?$|/\.env$|/terraform\.tfvars$|/id_rsa$|\.pem$|\.ppk$|/\.ssh/)' || true)"

          # Provider credential/token files, anywhere in the image.
          global_hits="$(grep -E -i '(/\.aws/credentials$|/accessTokens\.json$|/azureProfile\.json$|/\.azure/.*\.json$)' image_files.txt || true)"

          if [ -n "${app_hits}${global_hits}" ]; then
            echo "::error::Credential, key, or state files found in the image — refusing to publish."
            printf '%s\n' "${app_hits}" "${global_hits}"
            exit 1
          fi
          echo "OK: no credential, key, or state files found in the image."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push (latest + commit SHA)
        run: |
          set -euo pipefail
          built="${IMAGE_NAME}:ci-${{ github.sha }}"
          sha_short="$(echo "${{ github.sha }}" | cut -c1-12)"
          docker tag "$built" "${IMAGE_NAME}:latest"
          docker tag "$built" "${IMAGE_NAME}:${sha_short}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${sha_short}"
          echo "Pushed ${IMAGE_NAME}:latest and ${IMAGE_NAME}:${sha_short}"
